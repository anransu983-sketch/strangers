<!DOCTYPE html>
<!-- theme:bocchi-starlight 波奇酱·星空 -->

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎸 波奇ちゃん探针</title>
<link rel="stylesheet" href="{{ theme_static }}/css/style.css">

<body>
<div class="wrap">
  <header>
    <div class="logo">🎸 波奇ちゃん<small>MyProbe · v{{ version }}</small></div>
    <div class="spacer"></div>
    <nav class="nav">

  <div id="view-probes" style="display:none">

  </div>

  <footer>🎸 Powered by <b>MyProbe</b> v{{ version }} · 主题 <b>波奇酱·星空</b>（背景美术：jujiunofly，MIT）</footer>
</div>

<div id="termOverlay">
  <div id="termBar"><span class="t" id="termTitle">💻 终端</span>
    <button onclick="termRefit()" title="重新适配大小">⛶ 自适应</button>
    <button onclick="termClose()">✕ 关闭</button></div>
  <div id="termAuth"><input id="termPass" type="password" placeholder="输入一次性 SSH 密码（不保存）" autocomplete="off" onkeydown="if(event.key==='Enter')termConnectWithPass()">
    <button class="btn sm" onclick="termConnectWithPass()">连接</button></div>

  <div id="termBody"></div>
</div>
<script src="{{ theme_static }}/vendor/xterm/xterm.min.js"></script>
<script src="{{ theme_static }}/vendor/xterm/addon-fit.min.js"></script>
<script>
"use strict";
/* ---------- 明暗切换（波奇酱壁纸） ---------- */
var root = document.documentElement;
try { root.dataset.theme = localStorage.getItem("bocchi-theme") || "light"; } catch(e){}
function syncToggle(){ document.getElementById("themeToggle").textContent = root.dataset.theme === "dark" ? "☀️" : "🌙"; }
syncToggle();
document.getElementById("themeToggle").onclick = function(){
  root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem("bocchi-theme", root.dataset.theme); } catch(e){}
  syncToggle();
};

/* ---------- 视图切换 ---------- */
var IS_ADMIN = false, curView = "board", curAtab = "nodes";
document.querySelectorAll(".navbtn").forEach(function(a){
  a.addEventListener("click", function(e){
    e.preventDefault();
    document.querySelectorAll(".navbtn").forEach(function(x){ x.classList.remove("on"); });
    a.classList.add("on");
    curView = a.dataset.v;
    document.getElementById("view-board").style.display = curView === "board" ? "" : "none";
    document.getElementById("view-probes").style.display = curView === "probes" ? "" : "none";
    document.getElementById("view-admin").style.display = curView === "admin" ? "" : "none";
    if (curView === "admin") renderAtabs();
    document.getElementById("nodebar").style.display = curView === "board" ? "" : "none";
    window.scrollTo(0, 0);
  });
});

/* ---------- 格式化 ---------- */
function fmtRate(bps){
  if (bps === null || bps === undefined || isNaN(bps)) return "—";
  bps = Number(bps);
  if (bps < 1024) return bps.toFixed(0) + " B/s";
  if (bps < 1048576) return (bps/1024).toFixed(1) + " KB/s";
  return (bps/1048576).toFixed(2) + " MB/s";
}
function fmtUptime(s){
  if (s === null || s === undefined) return "—";
  s = Math.floor(Number(s));
  var d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  if (d > 0) return d + "天 " + h + "小时 " + m + "分";
  if (h > 0) return h + "小时 " + m + "分";
  return m + "分";
}
function esc(s){ return String(s === null || s === undefined ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function bar(pct){ pct = Math.max(0, Math.min(100, Number(pct) || 0)); return '<div class="bar"><i style="width:' + pct.toFixed(1) + '%"></i></div>'; }

/* ---------- 节点卡片 ---------- */
var openCharts = {};
function osIcon(n){
  var s = ((n.platform||"") + " " + (n.os||"")).toLowerCase();
  if (s.indexOf("win") >= 0) return "🪟";
  if (s.indexOf("darwin") >= 0 || s.indexOf("mac") >= 0) return "🍎";
  if (s.indexOf("linux") >= 0) return "🐧";
  return "💻";
}
function gb(v){ return (v===null||v===undefined||isNaN(v)) ? "—" : Number(v).toFixed(1); }
function mb(v){ return (v===null||v===undefined||isNaN(v)) ? "—" : (Number(v)/1024).toFixed(1); }
function starDays(uptime){
  if (uptime===null||uptime===undefined) return "—";
  var d = Math.floor(Number(uptime)/86400);
  if (d > 0) return d + " 天";
  return Math.floor(Number(uptime)/3600) + " 小时";
}
/* 分段条：frac 0~1，n 段，colorFn(frac) 取色 */
function segbar(frac, n, colorFn){
  frac = Math.max(0, Math.min(1, Number(frac) || 0));
  var h = "";
  for (var i=0;i<n;i++){
    var on = (i+0.5)/n <= frac;
    h += '<i class="' + (on ? "on" : "") + '"' + (on ? ' style="background:' + colorFn(frac) + '"' : "") + '></i>';
  }
  return '<span class="segbar">' + h + '</span>';
}
/* v5：本节点独立拨测行（history 分段条：粉=成功 红=失败 灰=暂无，22 段最老在前） */
function probeRowNode(p){
  var lat = (p.latency_ms===null||p.latency_ms===undefined);
  var loss = (p.loss_pct===null||p.loss_pct===undefined);
  var latTxt = lat ? "\u2014" : Number(p.latency_ms).toFixed(0) + " ms";
  var lossTxt = loss ? "\u2014" : Number(p.loss_pct).toFixed(1) + "%";
  var bars = p.bars || [], hlats = p.hist_lat || [];
  var latSegs = "", lossSegs = "";
  for (var i=0;i<22;i++){
    var b = bars[i], hl = hlats[i];
    if (b === undefined){ latSegs += '<i></i>'; lossSegs += '<i></i>'; }
    else if (b){
      var f = Math.min(1, Number(hl||0)/400);
      var c = f>0.75 ? "#fb7185" : f>0.4 ? "#f472b6" : "#f9a8d4";
      latSegs += '<i class="on" style="background:'+c+';color:'+c+'"></i>';
      lossSegs += '<i class="on" style="background:#f9a8d4;color:#f9a8d4"></i>';
    } else {
      latSegs += '<i class="on" style="background:#f87171;color:#f87171"></i>';
      lossSegs += '<i class="on" style="background:#f87171;color:#f87171"></i>';
    }
  }
  return '<div class="prow">' +
    '<span class="pname">' + esc(p.name) + '</span>' +
    '<span class="pcol"><span class="pval">' + latTxt + '</span><span class="segbar">' + latSegs + '</span></span>' +
    '<span class="pcol"><span class="pval">' + lossTxt + '</span><span class="segbar">' + lossSegs + '</span></span>' +
  "</div>";
}


/* ================= v6.0：Web SSH 终端 ================= */
function termBtnHtml(n){
  if (!(n.ssh_host || "").trim()) return "";
  return '<span class="hicon termbtn" title="在面板内打开 SSH 终端" onclick="event.stopPropagation();openTerminal(\'' + esc(n.id) + '\')">💻</span>';
}
var T = {sid: null, term: null, fit: null, timer: null, node: null};
function termMsg(t, isErr){
  var m = document.getElementById("termMsg");
  m.textContent = t || "";
  m.className = t ? ("show" + (isErr ? " err" : "")) : "";
}
async function openTerminal(nid){
  var n = null;
  try {
    var rr = await (await fetch("/api/nodes")).json();
    (rr.nodes || []).forEach(function(x){ if (x.id === nid) n = x; });
  } catch(e){}
  if (!n){ termMsg("未找到节点", true); return; }
  if (typeof Terminal === "undefined"){ alert("终端组件未加载"); return; }
  await termClose(true);
  T.node = n;
  document.getElementById("termTitle").textContent = "💻 " + n.name + " 终端";
  document.getElementById("termOverlay").classList.add("open");
  document.getElementById("termAuth").classList.toggle("show", !n.ssh_ready);
  document.getElementById("termPass").value = "";
  termMsg("");
  T.term = new Terminal({cursorBlink: true, fontSize: 14,
    theme: {background: "#1a0f1e", foreground: "#fbd3e8"}});
  T.fit = new FitAddon.FitAddon();
  T.term.loadAddon(T.fit);
  T.term.open(document.getElementById("termBody"));
  T.term.focus();
  T.term.onData(function(d){ termSend(d); });
  termRefit();
  window.addEventListener("resize", termOnWinResize);
  if (n.ssh_ready){
    termMsg("正在连接 " + (n.ssh_user || "root") + "@" + n.ssh_host + " …");
    await termConnect("");
  } else {
    termMsg("该节点未保存 SSH 密码：输入一次性密码连接（不保存）。");
    document.getElementById("termPass").focus();
  }
}
async function termConnect(pw){
  var dims = null;
  try { dims = T.fit.proposeDimensions(); } catch(e){}
  var body = {node_id: T.node.id, cols: dims ? dims.cols : 100, rows: dims ? dims.rows : 30};
  if (pw) body.password = pw;
  var r;
  try { r = await apiAdmin("POST", "/api/admin/ssh/connect", body); }
  catch(e){ r = {ok: false, error: "网络错误"}; }
  if (!r.ok){ termMsg("❌ " + (r.error || "连接失败"), true); return; }
  T.sid = r.session_id;
  document.getElementById("termAuth").classList.remove("show");
  termMsg("");
  try { T.term.clear(); } catch(e){}
  termStopPoll();
  T.timer = setInterval(termPoll, 250);
}
async function termConnectWithPass(){
  var pw = document.getElementById("termPass").value;
  if (!pw){ termMsg("请输入密码", true); return; }
  termMsg("正在连接…");
  await termConnect(pw);
  document.getElementById("termPass").value = "";
}
async function termPoll(){
  if (!T.sid) return;
  var r;
  try { r = await (await fetch("/api/admin/ssh/poll?session_id=" + encodeURIComponent(T.sid))).json(); }
  catch(e){ return; }
  if (r.data && T.term){ try { T.term.write(r.data); } catch(e){} }
  if (!r.ok || r.closed){ termStopPoll(); termMsg("⚠ 连接已关闭", true); }
}
var _sendQ = Promise.resolve();
function termSend(d){
  if (!T.sid) return;
  _sendQ = _sendQ.then(function(){
    return apiAdmin("POST", "/api/admin/ssh/input", {session_id: T.sid, data: d}).catch(function(){});
  }).catch(function(){});
}
function termRefit(){
  if (!T.term || !T.fit) return;
  try {
    T.fit.fit();
    var d = T.fit.proposeDimensions();
    if (d && T.sid)
      apiAdmin("POST", "/api/admin/ssh/resize", {session_id: T.sid, cols: d.cols, rows: d.rows}).catch(function(){});
  } catch(e){}
}
function termOnWinResize(){ termRefit(); }
function termStopPoll(){ if (T.timer){ clearInterval(T.timer); T.timer = null; } }
async function termClose(silent){
  termStopPoll();
  window.removeEventListener("resize", termOnWinResize);
  if (T.sid){
    var sid = T.sid; T.sid = null;
    try { await apiAdmin("POST", "/api/admin/ssh/close", {session_id: sid}); } catch(e){}
  }
  if (T.term){ try { T.term.dispose(); } catch(e){} T.term = null; T.fit = null; }
  T.node = null;
  if (!silent){ document.getElementById("termOverlay").classList.remove("open"); termMsg(""); }
}
/* v6.0：清除已存 SSH 密码 */
async function clearSshPass(id){
  if (!confirm("确定清除该节点已保存的 SSH 密码？")) return;
  var r = await apiAdmin("PUT", "/api/admin/node/" + encodeURIComponent(id) + "/meta", {ssh_clear_pass: true});
  var m = document.getElementById("meta-msg-" + id);
  if (r.ok){ m.textContent = "✅ 已清除"; refresh(); }
  else m.textContent = "❌ " + (r.error || "清除失败");
}

function nodeCard(n){
  var off = !n.online;
  /* 徽章行 */
  var pills = "";
  pills += '<span class="pill">在线 ' + starDays(n.uptime) + '</span>';
  if (n.price){
    var cyc = n.bill_cycle === "yearly" ? "年付" : n.bill_cycle === "monthly" ? "月付" : "";
    pills += '<span class="pill">' + (cyc ? cyc + " · " : "") + esc(n.currency||"¥") + n.price + '</span>';
  }
  /* 2×2 指标 */
  function stat(icon, label, pct, val, sub){
    return '<div class="stat"><div class="srow"><span class="sic">' + icon + '</span>' +
      '<span class="slb">' + label + '</span><span class="sval">' +
      (pct===null||pct===undefined ? "—" : Number(pct).toFixed(1) + "%") + '</span></div>' +
      '<div class="bar"><i style="width:' + Math.max(0,Math.min(100,Number(pct)||0)).toFixed(1) + '%"></i></div>' +
      '<div class="ssub">' + sub + '</div></div>';
  }
  var memUsedMB = (n.mem!==null && n.mem_total) ? (n.mem/100*n.mem_total/1048576) : null;
  var memSub = (memUsedMB!==null && n.mem_total) ? memUsedMB.toFixed(1) + " MB / " + (n.mem_total/1048576).toFixed(1) + " MB" : "—";
  var diskUsedGB = (n.disk!==null && n.disk_total) ? (n.disk/100*n.disk_total/1073741824) : null;
  var diskSub = (diskUsedGB!==null && n.disk_total) ? diskUsedGB.toFixed(1) + " GB / " + (n.disk_total/1073741824).toFixed(1) + " GB" : "—";
  var qSub, qPct = n.quota_pct || 0;
  if (n.quota_gb && n.quota_gb > 0){
    qSub = gb(n.quota_used_gb) + " GB / " + n.quota_gb + " GB";
  } else { qSub = "未设配额"; }
  var loadSub = (n.load1===null||n.load1===undefined) ? "—" : "负载 " + Number(n.load1).toFixed(2);
  /* 三小卡 */
  var mini1 = '<div>⇑ ' + fmtRate(n.tx) + '</div><div>⇓ ' + fmtRate(n.rx) + '</div>';
  var tot = ((n.total_rx_gb||0) + (n.total_tx_gb||0));
  var mini2 = '<div>⇑ ' + gb(n.total_tx_gb) + ' GB</div><div>⇓ ' + gb(n.total_rx_gb) + ' GB</div>';
  var mini3 = "";
  if (n.days_left!==null && n.days_left!==undefined) mini3 += '<div>余期' + n.days_left + '天</div>';
  if (n.remain_value!==null && n.remain_value!==undefined) mini3 += '<div>余值' + (n.currency||'¥') + n.remain_value + '</div>';
  if (!mini3) mini3 = '<div class="dim">—</div>';
  /* 探测区（v5：本节点 agent 独立探测） */
  var probeSec = "";
  var nps = n.probes || [];
  if (nps.length){
    var anyData = nps.some(function(p){ return p.latency_ms!==null && p.latency_ms!==undefined; });
    probeSec = '<div class="psec"><div class="phead"><span>探测目标</span><span>延迟</span><span>丢包</span></div>' +
      (anyData ? nps.map(probeRowNode).join("") : '<div class="dim" style="padding:8px 2px;font-size:12px">\U0001F4E1 等待节点上报拨测数据…</div>') + '</div>';
  }
  var badge = "";
  if (n.days_left !== null && n.days_left !== undefined){
    var cls = n.days_left <= 7 ? "red" : (n.days_left <= 30 ? "yellow" : "");
    badge = '<span class="badge ' + cls + '">余期' + n.days_left + '天</span>';
  }
  return '<div class="card' + (off ? ' offline' : '') + '" id="node-' + esc(n.id) + '" data-nid="' + esc(n.id) + '">' +
    '<div class="chead"><span class="draghandle" data-nid="' + esc(n.id) + '" title="\u62d6\u52a8\u6392\u5e8f">\u283f</span><span class="sicon">✦</span>' +
      '<div class="ctitle"><div class="cname">' + esc(n.name) + '</div><div class="csub">BOCCHI☆STAGE ON</div></div>' +
      '<div class="spacer"></div>' +
      '<span class="hicon" title="收藏">☆</span><span class="hicon">' + osIcon(n) + '</span><span class="hicon" title="' + esc(n.ip||"") + '">🌐</span>' +
      badge + termBtnHtml(n) + '</div>' +
    '<div class="pills">' + pills + '</div>' +
    '<div class="sgrid">' +
      stat("🖥️", "CPU", n.cpu, null, loadSub) +
      stat("🧠", "内存", n.mem, null, memSub) +
      stat("🗄️", "硬盘", n.disk, null, diskSub) +
      stat("⚡", "流量", (n.quota_gb ? qPct : null), null, qSub) +
    '</div>' +
    '<div class="minis"><div class="mini">' + mini1 + '</div><div class="mini">' + mini2 + '</div><div class="mini">' + mini3 + '</div></div>' +
    probeSec +
    '<div class="detail"><div class="ranges">' +
      ["1h","6h","24h","7d"].map(function(r){ return '<button data-r="'+r+'" class="'+((openCharts[n.id]||"1h")===r?"on":"")+'">'+r+'</button>'; }).join("") +
    '</div><div class="chart-title">CPU / 内存 %</div><canvas class="chart" data-k="pct"></canvas>' +
    '<div class="chart-title">上行 / 下行</div><canvas class="chart" data-k="net"></canvas>' +
    '<div class="chart-title">📊 每日流量（近30天） <span class="daily-total" data-k="dtotal"></span></div><canvas class="chart" data-k="daily"></canvas></div>' +
  '</div>';
}

/* ---------- 历史曲线 ---------- */
function drawLine(cv, series, colors){
  var dpr = window.devicePixelRatio || 1;
  var w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  cv.width = w*dpr; cv.height = h*dpr;
  var ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  var all = [];
  series.forEach(function(s){ s.forEach(function(v){ if(v!==null&&v!==undefined) all.push(v); }); });
  if (!all.length){ ctx.fillStyle="#a2657c"; ctx.font="12px sans-serif"; ctx.fillText("暂无数据",10,h/2); return; }
  var max = Math.max.apply(null, all.concat([1]));
  var n = series[0].length;
  series.forEach(function(s, si){
    ctx.beginPath(); ctx.strokeStyle = colors[si]; ctx.lineWidth = 1.6;
    var started = false;
    s.forEach(function(v,i){
      var x = n<=1 ? 0 : i/(n-1)*w, y = h-4-(v/max)*(h-10);
      if (v===null||v===undefined){ started=false; return; }
      if (!started){ ctx.moveTo(x,y); started=true; } else ctx.lineTo(x,y);
    });
    ctx.stroke();
  });
}
/* v4：每日流量分组柱状图（粉色风） */
function drawDailyBars(cv, days){
  if (!cv || !days || !days.length) return;
  var dpr = window.devicePixelRatio || 1;
  var w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  cv.width = w*dpr; cv.height = h*dpr;
  var ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  var padL = 34, padR = 6, padT = 6, padB = 16;
  var iw = w - padL - padR, ih = h - padT - padB;
  var mx = 1;
  days.forEach(function(d){ mx = Math.max(mx, d.rx_gb||0, d.tx_gb||0); });
  var Y = function(v){ return padT + ih - v/mx*ih; };
  ctx.font = "10px sans-serif"; ctx.lineWidth = 1;
  for (var g = 0; g <= 3; g++){
    var v = mx*g/3, y = Y(v);
    ctx.strokeStyle = "rgba(236,72,153,.20)"; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    ctx.fillStyle = "#a2657c"; ctx.fillText(v.toFixed(1), 2, y+3);
  }
  var n = days.length, slot = iw/n, bw = Math.max(2, slot*0.26);
  days.forEach(function(d, i){
    var x = padL + slot*i + slot/2;
    ctx.fillStyle = "rgba(244,114,182,.9)";
    var hrx = (d.rx_gb||0)/mx*ih; ctx.fillRect(x-bw-1, Y(d.rx_gb||0), bw, hrx);
    ctx.fillStyle = "rgba(168,85,247,.9)";
    var htx = (d.tx_gb||0)/mx*ih; ctx.fillRect(x+1, Y(d.tx_gb||0), bw, htx);
    if (i % Math.ceil(n/8) === 0){ ctx.fillStyle = "#a2657c"; ctx.fillText(String(d.day).slice(5), x-11, h-3); }
  });
  ctx.font = "11px sans-serif";
  ctx.fillStyle = "#f472b6"; ctx.fillRect(padL, 2, 9, 3);
  ctx.fillStyle = "#a2657c"; ctx.fillText("下行", padL+12, 8);
  ctx.fillStyle = "#f472b6"; ctx.fillRect(padL+48, 2, 9, 3);
  ctx.fillStyle = "#a2657c"; ctx.fillText("上行", padL+60, 8);
}
/* v4：节点 id → 节点对象，供累计流量显示 */
var nodesById = {};
async function loadDetail(card, nid){
  var range = openCharts[nid] || "1h";

var dragOrderIds = [];        /* 当前 API 顺序的 id 列表 */

var suppressChipClick = false;
var cardDrag = null;

function orderAfterMove(ids, fromIdx, pos){
  var arr = ids.slice();

}
function postNodeOrder(ids){

/* ---- 卡片纵向拖拽（Pointer Events，ES5） ---- */
function onDragHandleDown(e, handle){
  if (e.pointerType === "mouse" && e.button !== 0) return;
  if (dragInProgress) return;
  var card = handle.closest(".card");
  var grid = document.getElementById("grid");
  if (!card || !grid) return;
  var cards = Array.prototype.slice.call(grid.querySelectorAll(".card"));
  if (cards.length < 2) return;
  e.preventDefault();
  e.stopPropagation();
  var rect = card.getBoundingClientRect();
  var gridRect = grid.getBoundingClientRect();
  var ph = document.createElement("div");
  ph.className = "drag-ph";
  ph.style.height = rect.height + "px";
  card.parentNode.insertBefore(ph, card);
  card.classList.add("dragging");
  card.style.width = rect.width + "px";
  card.style.left = rect.left + "px";
  card.style.top = rect.top + "px";
  var slots = cards.map(function(c, i){
    var r = c.getBoundingClientRect();
    return {el: c, idx: i, top: r.top - gridRect.top, h: r.height};
  });
  var fromIdx = cards.indexOf(card);
  var gap = 16;
  if (cards.length > 1){
    var r0 = cards[0].getBoundingClientRect(), r1 = cards[1].getBoundingClientRect();
    gap = Math.max(0, (r1.top - r0.top) - r0.height);
  }
  cardDrag = {card: card, ph: ph, grid: grid, fromIdx: fromIdx, pos: fromIdx,
    startY: e.clientY, origTop: rect.top, h: rect.height, gap: gap,
    moved: false, pid: e.pointerId,
    others: slots.filter(function(s){ return s.idx !== fromIdx; })};
  dragInProgress = true;
  window.addEventListener("pointermove", onCardDragMove, {passive: false});
  window.addEventListener("pointerup", onCardDragUp);
  window.addEventListener("pointercancel", onCardDragUp);
}
function onCardDragMove(e){
  var d = cardDrag;
  if (!d || (e.pointerId !== undefined && e.pointerId !== d.pid)) return;
  if (e.cancelable) e.preventDefault();
  var dy = e.clientY - d.startY;
  if (Math.abs(dy) > 6) d.moved = true;
  var gridRect = d.grid.getBoundingClientRect();
  var newTop = d.origTop + dy;
  /* 按中心钳制：中心可在首槽位顶 ~ 尾槽位底之间，保证能拖到最上/最下 */
  if (newTop < gridRect.top - d.h / 2) newTop = gridRect.top - d.h / 2;
  if (newTop > gridRect.bottom - d.h / 2) newTop = gridRect.bottom - d.h / 2;
  d.card.style.top = newTop + "px";
  var centerY = (newTop - gridRect.top) + d.h / 2;
  var k = 0, i, o;
  for (i = 0; i < d.others.length; i++){
    o = d.others[i];
    if (o.top + o.h / 2 < centerY) k++;
  }
  if (k !== d.pos){
    d.pos = k;
    var step = d.h + d.gap;
    for (i = 0; i < d.others.length; i++){
      o = d.others[i];
      var shift = 0;
      if (d.pos > d.fromIdx && o.idx > d.fromIdx && o.idx <= d.pos) shift = -step;
      else if (d.pos < d.fromIdx && o.idx >= d.pos && o.idx < d.fromIdx) shift = step;
      o.el.style.transform = shift ? ("translateY(" + shift + "px)") : "";
    }
  }
}
async function onCardDragUp(e){
  var d = cardDrag;
  if (!d || (e.pointerId !== undefined && e.pointerId !== d.pid)) return;
  window.removeEventListener("pointermove", onCardDragMove);
  window.removeEventListener("pointerup", onCardDragUp);
  window.removeEventListener("pointercancel", onCardDragUp);
  var changed = d.moved && d.pos !== d.fromIdx;
  var newIds = changed ? orderAfterMove(dragOrderIds, d.fromIdx, d.pos) : null;
  d.card.classList.remove("dragging");
  d.card.style.cssText = "";
  if (d.ph.parentNode) d.ph.parentNode.removeChild(d.ph);
  d.others.forEach(function(o){ o.el.style.transform = ""; });
  if (d.moved) suppressCardClick = true;
  cardDrag = null;
  if (!changed){ dragInProgress = false; return; }
  var ok = await postNodeOrder(newIds);
  if (ok) dragOrderIds = newIds;
  await afterOrderChanged(ok);
}

/* ---- 芯片横向拖拽（长按 350ms 进入，ES5） ---- */
function initChipDrag(chipsEl){
  if (!chipsEl || chipsEl._chipDragInit) return;
  chipsEl._chipDragInit = true;
  var st = null;
  function nodeChips(){
    return Array.prototype.filter.call(chipsEl.querySelectorAll(".nodechip"), function(c){
      return !c.hasAttribute("data-all");
    });
  }
  function cleanupListeners(){
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    window.removeEventListener("pointercancel", onUp);
  }
  chipsEl.addEventListener("pointerdown", function(e){
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (dragInProgress) return;
    var chip = (e.target && e.target.closest) ? e.target.closest(".nodechip") : null;
    if (!chip || chip.hasAttribute("data-all")) return;  /* 「全部」不可拖 */
    if (nodeChips().length < 2) return;
    st = {chip: chip, startX: e.clientX, startY: e.clientY, mode: "maybe",
      pid: e.pointerId};
    window.addEventListener("pointermove", onMove, {passive: false});
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
  });
  function enterChipDrag(){
    if (!st || st.mode !== "maybe") return;
    st.mode = "drag";
    dragInProgress = true;
    var chips = nodeChips();
    var items = chips.map(function(c, i){
      return {el: c, idx: i, left: c.offsetLeft, w: c.offsetWidth};
    });
    var fromIdx = -1, i;
    for (i = 0; i < items.length; i++) if (items[i].el === st.chip) fromIdx = i;
    var gap = 8;
    if (items.length > 1) gap = Math.max(0, items[1].left - items[0].left - items[0].w);
    st.items = items;
    st.fromIdx = fromIdx;
    st.pos = fromIdx;
    st.chipW = st.chip.offsetWidth;
    st.gap = gap;
    st.others = items.filter(function(it){ return it.idx !== fromIdx; });
    st.chip.classList.add("chipdrag");
    try { if (navigator.vibrate) navigator.vibrate(30); } catch(err){}
  }
  function onMove(e){
    if (!st || (e.pointerId !== undefined && e.pointerId !== st.pid)) return;
    if (st.mode === "maybe"){
      var dx0 = e.clientX - st.startX, dy0 = e.clientY - st.startY;
      var adx = dx0 < 0 ? -dx0 : dx0, ady = dy0 < 0 ? -dy0 : dy0;
      if (ady > 14 && ady > adx){ cleanupListeners(); st = null; return; }  /* 纵滑：交给页面滚动 */
      if (adx <= 14) return;
      enterChipDrag();  /* 横滑超 14px：直接进入拖拽 */
      if (!st || st.mode !== "drag") return;
    }
    if (st.mode !== "drag") return;
    if (e.cancelable) e.preventDefault();
    var dx = e.clientX - st.startX;
    st.chip.style.transform = "translateX(" + dx + "px) scale(1.08)";
    var centerX = st.items[st.fromIdx].left + st.chipW / 2 + dx;
    var k = 0, i, o;
    for (i = 0; i < st.others.length; i++){
      o = st.others[i];
      if (o.left + o.w / 2 < centerX) k++;
    }
    if (k !== st.pos){
      st.pos = k;
      var step = st.chipW + st.gap;
      for (i = 0; i < st.others.length; i++){
        o = st.others[i];
        var shift = 0;
        if (st.pos > st.fromIdx && o.idx > st.fromIdx && o.idx <= st.pos) shift = -step;
        else if (st.pos < st.fromIdx && o.idx >= st.pos && o.idx < st.fromIdx) shift = step;
        o.el.style.transform = shift ? ("translateX(" + shift + "px)") : "";
      }
    }
  }
  async function onUp(e){
    if (!st || (e.pointerId !== undefined && e.pointerId !== st.pid)) return;
    cleanupListeners();
    var wasDrag = st.mode === "drag";
    var changed = wasDrag && st.pos !== st.fromIdx;
    if (wasDrag){
      st.chip.classList.remove("chipdrag");
      st.chip.style.transform = "";
      st.items.forEach(function(it){ it.el.style.transform = ""; });
      suppressChipClick = true;
    }
    var s = st; st = null;
    if (!changed){ dragInProgress = false; return; }
    var newIds = orderAfterMove(dragOrderIds, s.fromIdx, s.pos);
    var ok = await postNodeOrder(newIds);
    if (ok) dragOrderIds = newIds;
    await afterOrderChanged(ok);
  }
}

async function saveNodeMeta(id){
  var box = document.getElementById("meta-" + id);
  var d = {};
  box.querySelectorAll("[data-k]").forEach(function(el){ d[el.dataset.k] =
    (el.type === "password" ? el.value : el.value.trim()); });
  var name = d.name; delete d.name;
  var msg = document.getElementById("meta-msg-" + id);
  var r1 = await apiAdmin("POST", "/api/admin/node/" + encodeURIComponent(id) + "/rename", {name: name});
  var r2 = await apiAdmin("PUT", "/api/admin/node/" + encodeURIComponent(id) + "/meta", d);
  if (r1.ok && r2.ok){ msg.textContent = "✅ 已保存"; refresh(); }
  else msg.textContent = "❌ " + ((r1.error||"") + " " + (r2.error||""));
}
async function delNode(id){
  if (!confirm("确定删除节点 " + id + " 及其历史数据吗？")) return;
  var r = await apiAdmin("DELETE", "/api/admin/node/" + encodeURIComponent(id));
  if (r.ok){ renderAtab(); refresh(); } else alert("删除失败：" + (r.error||""));
}

async function saveProbe(id){
  var d = {name: document.getElementById("pf-name").value.trim(), type: document.getElementById("pf-type").value,
    host: document.getElementById("pf-host").value.trim(), port: document.getElementById("pf-port").value,
    path: document.getElementById("pf-path").value.trim(), interval: document.getElementById("pf-interval").value,
    enabled: document.getElementById("pf-enabled").value === "1"};
  var r = id == null ? await apiAdmin("POST", "/api/admin/probes", d)
                     : await apiAdmin("PUT", "/api/admin/probes/" + id, d);
  if (r.ok) renderAtab(); else alert("保存失败：" + (r.error||""));
}
async function editProbe(id){
  var r = await apiAdmin("GET", "/api/admin/probes");
  var t = (r.tasks||[]).find(function(x){ return x.id === id; });
  if (!t) return;
  var b = document.getElementById("atab-body");
  b.innerHTML = '<div class="frm"><h3>✏️ 编辑拨测任务</h3><div id="probe-form"></div>' +
    '<div class="btnrow"><button class="btn" onclick="saveProbe(' + id + ')">保存</button>' +
    '<button class="btn ghost" onclick="renderAtab()">取消</button></div></div>';
  probeForm(t);
  window.scrollTo(0,0);
}
async function delProbe(id){
  if (!confirm("确定删除该拨测任务及其历史结果吗？")) return;
  var r = await apiAdmin("DELETE", "/api/admin/probes/" + id);
  if (r.ok) renderAtab(); else alert("删除失败：" + (r.error||""));

/* v6.2：服务端即时测试拨测任务（服务端视角，各节点结果仍走 agent 周期） */
async function testProbe(id){
  var btn = event && event.target ? event.target : null;
  if (btn) { btn.disabled = true; btn.textContent = "⏳…"; }
  try {
    var r = await apiAdmin("POST", "/api/admin/probes/" + id + "/test");
    if (!r.ok) { alert("测试失败：" + (r.error||"")); return; }
    alert(r.reachable
      ? "✅ " + r.name + "\n服务端即时测试：延迟 " + r.latency + " ms，丢包 " + r.loss + "%\n（各节点独立结果将在 60 秒内出现在拨测页）"
      : "❌ " + r.name + "\n服务端即时测试：不通（丢包 " + r.loss + "%），请检查目标地址/端口");
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "⚡测试"; }
  }
}

var CTYPE_LABEL = {webhook:"Webhook", telegram:"Telegram", email:"邮件"};
function channelFields(type, cfg){
  cfg = cfg || {};

    return '<div><label>' + label + '</label><input data-k="' + k + '" type="' + (pw?"password":"text") +
      '" value="' + esc(cfg[k]==null?"":cfg[k]) + '" placeholder="' + (ph||"") + '"></div>';

  if (type === "telegram") return inp("bot_token", "Bot Token", "123456:ABC...", true) + inp("chat_id", "Chat ID", "123456789");
  return '<div class="row2">' + inp("smtp_host","SMTP 服务器","smtp.resend.com") + inp("smtp_port","SMTP 端口","587") + '</div>' +
    '<div class="row2">' + inp("username","SMTP 用户名","") + inp("password","SMTP 密码 / 授权码","",true) + '</div>' +
    '<div class="row2">' + inp("from","发件人（可空=用户名）","") + inp("to","收件人（逗号分隔）","a@b.com") + '</div>';

        '<button class="btn sm" onclick="togglePlugin(\'' + esc(p.id) + '\',' + (p.enabled?0:1) + ')">' + (p.enabled?"停用":"启用") + '</button> ' +
        '<button class="btn sm danger" onclick="delPlugin(\'' + esc(p.id) + '\')">删除</button></td></tr>';
    }).join("") + '</table></div>' +
    '<div class="frm"><h3>⬆️ 上传插件（zip 包）</h3>' +
    '<input type="file" id="plugin-file" accept=".zip" style="margin-bottom:10px">' +
    '<div class="btnrow"><button class="btn" onclick="uploadPlugin()">上传</button>' +
    '<button class="btn ghost" onclick="reloadPlugins()">🔄 重新加载</button></div>' +
    '<div class="note">zip 内必须包含 plugin.json + plugin.py。</div></div>';
}
async function uploadPlugin(){
  var f = document.getElementById("plugin-file").files[0];
  if (!f) return alert("请先选择 zip 文件");
  var fd = new FormData(); fd.append("file", f);
  var r = await (await fetch("/api/admin/plugins/upload", {method:"POST", body:fd})).json();
  if (!r.ok) return alert("上传失败：" + (r.error||"未知错误"));
  renderAtab();
}
async function togglePlugin(id, on){
  var r = await apiAdmin("POST", "/api/admin/plugins/" + encodeURIComponent(id) + "/" + (on?"enable":"disable"));
  if (!r.ok) return alert("操作失败：" + (r.error||""));
  renderAtab();
}
async function reloadPlugins(){
  var r = await apiAdmin("POST", "/api/admin/plugins/reload");
  alert(r.ok ? "已重载 " + r.count + " 个插件" : "重载失败：" + (r.error||""));
  renderAtab();
}
async function delPlugin(id){
  if (!confirm("确定删除插件 " + id + "？")) return;
  var r = await apiAdmin("DELETE", "/api/admin/plugins/" + encodeURIComponent(id));
  if (!r.ok) return alert("删除失败：" + (r.error||""));
  renderAtab();
}

/* ---------- 启动 ---------- */
(async function(){
  try{ var me = await (await fetch("/api/me")).json(); if (me.admin){ IS_ADMIN = true; document.getElementById("adminNav").style.display=""; } }catch(e){}
  await refresh();
  setInterval(function(){ if (curView !== "admin") refresh(); }, 5000);
})();
</script>
</body>
</html>
